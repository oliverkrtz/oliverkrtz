<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hi, I'm Oliver. I build personal tools, dashboards and automations.">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="0.35" stop-color="#bf5af2"/>
      <stop offset="0.7" stop-color="#ff375f"/>
      <stop offset="1" stop-color="#ff9f0a"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-300 0; 300 0; -300 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="1.1" r="0.9">
      <stop offset="0" stop-color="#1d1d1f"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#haze)"/>

  <text x="600" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#f5f5f7">Hi, I'm Oliver<tspan fill="url(#shine)">.</tspan></text>

  <text x="600" y="204" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" letter-spacing="-0.2" fill="#86868b">Personal tools, dashboards &amp; automations. <tspan fill="url(#shine)" font-weight="500">Thoughtfully built.</tspan></text>
</svg>
